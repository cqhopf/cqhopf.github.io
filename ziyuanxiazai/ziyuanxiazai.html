<!-- ==================== 读者服务 · 数学笔记 ==================== -->
<section id="reader-services">
  <style>
    #reader-services {
      --paper: #f7f1e3;
      --card: #fffdf7;
      --ink: #2f2a22;
      --ink-soft: #7b6f5c;
      --cinnabar: #a63d2f;
      --cinnabar-deep: #8d3125;
      --line: #e3d5b8;
      --gold: #b9975b;

      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", "Source Han Serif SC", serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 15% 18%, rgba(166, 61, 47, 0.05), transparent 42%),
        radial-gradient(circle at 85% 78%, rgba(92, 110, 90, 0.055), transparent 45%),
        repeating-linear-gradient(0deg, rgba(150, 125, 85, 0.03) 0 1px, transparent 1px 3px);
      padding: clamp(30px, 5vw, 58px) clamp(16px, 4vw, 32px) clamp(40px, 6vw, 66px);
      position: relative;
      overflow: hidden;
    }
    #reader-services *,
    #reader-services *::before,
    #reader-services *::after { box-sizing: border-box; }

    /* ---------- 顶部标题区 ---------- */
    #reader-services .rs-head {
      text-align: center;
      max-width: 760px;
      margin: 0 auto clamp(26px, 4vw, 42px);
      position: relative;
      z-index: 1;
    }
    #reader-services .rs-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px; height: 54px;
      border: 2px solid var(--cinnabar);
      border-radius: 50%;
      color: var(--cinnabar);
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: 16px;
      line-height: 1.02;
      letter-spacing: 1px;
      transform: rotate(-9deg);
      background: rgba(166, 61, 47, 0.045);
      box-shadow: inset 0 0 0 1px rgba(166, 61, 47, 0.18);
      margin-bottom: 12px;
    }
    #reader-services .rs-title-main {
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: clamp(1.55rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--ink);
      margin: 0 0 12px;
      text-indent: 0.18em;
    }
    #reader-services .rs-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--cinnabar);
      font-size: 0.8rem;
      letter-spacing: 0.24em;
      margin-bottom: 12px;
    }
    #reader-services .rs-ornament::before,
    #reader-services .rs-ornament::after {
      content: '';
      width: 46px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    #reader-services .rs-ornament::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }
    #reader-services .rs-sub {
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      color: var(--ink-soft);
      line-height: 1.8;
      margin: 0;
      letter-spacing: 0.02em;
    }

    /* ---------- 微信提示条 ---------- */
    #reader-services .rs-wechat-tip {
      display: none;
      max-width: 1200px;
      margin: 0 auto 18px;
      background: #fdf6e3;
      border: 1px solid #e6d3a8;
      border-left: 3px solid var(--cinnabar);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.84rem;
      color: #7a6410;
      line-height: 1.7;
    }
    #reader-services .rs-wechat-tip.is-visible { display: block; }
    #reader-services .rs-wechat-tip strong { color: #5c4a08; }

    /* ---------- 卡片网格：Grid 固定 3 列 + 轨道组居中 ---------- */
    #reader-services .rs-grid {
      display: grid;
      /* 3 列，每列最宽 380px；容器变窄时列宽自动收缩 */
      grid-template-columns: repeat(3, minmax(0, 380px));
      /* 只居中「整个列组」，不改变每行项目从左到右的顺序 */
      justify-content: center;
      align-items: stretch;
      gap: clamp(16px, 2.6vw, 24px);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    #reader-services .rs-card {
      min-width: 0;              /* 防止内容撑破列宽 */
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 10px rgba(90, 70, 40, 0.06), 0 1px 2px rgba(90, 70, 40, 0.04);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    #reader-services .rs-card:hover {
      transform: translateY(-5px);
      border-color: #d6c39c;
      box-shadow: 0 14px 32px rgba(90, 70, 40, 0.13);
    }

    /* 样张（可点击） */
    #reader-services .rs-sample {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      margin: 0;
      border: 0;
      background: #efe6d0;
      overflow: hidden;
      cursor: zoom-in;
      font: inherit;
      text-align: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    #reader-services .rs-sample img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.55s ease;
    }
    #reader-services .rs-sample:hover img { transform: scale(1.045); }
    #reader-services .rs-sample-empty {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #b8a888;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
    }
    #reader-services .rs-sample-hint {
      position: absolute;
      right: 10px; bottom: 10px;
      background: rgba(166, 61, 47, 0.92);
      color: #fdf6e8;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      padding: 5px 11px;
      border-radius: 999px;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    /* 信息区 */
    #reader-services .rs-body {
      position: relative;
      padding: clamp(15px, 2.6vw, 20px);
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    #reader-services .rs-body::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(166, 61, 47, 0.11);
      border-radius: 8px;
      pointer-events: none;
    }
    #reader-services .rs-card-title {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: clamp(1rem, 2.2vw, 1.06rem);
      font-weight: 700;
      margin: 0 0 8px;
      line-height: 1.45;
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    #reader-services .rs-card-desc {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.7;
      margin: 0 0 auto;
      padding-bottom: 16px;
    }

    /* 价格 + 按钮 */
    #reader-services .rs-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    #reader-services .rs-price {
      font-family: "Songti SC", "STSong", serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--cinnabar);
      line-height: 1;
      letter-spacing: 0.01em;
    }
    #reader-services .rs-price i {
      font-style: normal;
      font-size: 0.75em;
      margin-right: 2px;
      opacity: 0.85;
    }
    #reader-services .rs-buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: linear-gradient(180deg, #b8482f, var(--cinnabar));
      color: #fdf6e8;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid var(--cinnabar-deep);
      box-shadow: 0 2px 6px rgba(166, 61, 47, 0.28);
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
      line-height: 1;
    }
    #reader-services .rs-buy:hover {
      background: linear-gradient(180deg, #a63d2f, var(--cinnabar-deep));
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(166, 61, 47, 0.35);
    }
    #reader-services .rs-buy:active { transform: translateY(0); }

    /* ---------- PDF 预览模态框 ---------- */
    .rs-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
    }
    .rs-modal.is-open {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 3vw, 32px);
    }
    .rs-modal-mask {
      position: absolute;
      inset: 0;
      background: rgba(38, 32, 24, 0.74);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .rs-modal-box {
      position: relative;
      width: min(1000px, 100%);
      height: min(88vh, 920px);
      background: #faf5e9;
      border: 1px solid #d9c7a2;
      border-radius: 12px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Songti SC", "STSong", "SimSun", serif;
    }
    .rs-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #f3ead4, #eee2c6);
      border-bottom: 1px solid #ddcba8;
      flex-shrink: 0;
    }
    .rs-modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.03em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rs-modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .rs-modal-link {
      font-size: 0.78rem;
      color: var(--cinnabar);
      text-decoration: none;
      border-bottom: 1px dashed rgba(166, 61, 47, 0.5);
      padding-bottom: 1px;
      white-space: nowrap;
    }
    .rs-modal-link:hover { color: var(--cinnabar-deep); }
    .rs-modal-close {
      width: 32px; height: 32px;
      border: 1px solid #d9c7a2;
      background: #fffdf7;
      color: #6b5f4c;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .rs-modal-close:hover { background: var(--cinnabar); color: #fff; border-color: var(--cinnabar); }
    .rs-modal-body {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #f5efe0;
    }
    .rs-modal-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
    .rs-modal-frame[hidden] { display: none; }

    /* 微信内引导面板 */
    .rs-modal-tip {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 10px;
      color: var(--ink-soft);
      font-size: 0.9rem;
      line-height: 1.8;
    }
    .rs-modal-tip[hidden] { display: none; }
    .rs-modal-tip-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--cinnabar);
      letter-spacing: 0.05em;
      margin: 0 0 4px;
    }
    .rs-modal-tip p { margin: 0; max-width: 30em; }
    .rs-modal-tip-alt { font-size: 0.82rem; color: #9a8d78; margin-top: 8px !important; }
    .rs-modal-tip-link {
      display: inline-block;
      max-width: 100%;
      font-size: 0.78rem;
      color: var(--cinnabar);
      word-break: break-all;
      text-decoration: underline;
      padding: 6px 10px;
      background: #fff8e6;
      border: 1px solid #e6d3a8;
      border-radius: 6px;
    }

    /* ---------- 响应式 ---------- */
    /* 平板 / 小笔记本：2 列 */
    @media (max-width: 980px) {
      #reader-services .rs-grid {
        grid-template-columns: repeat(2, minmax(0, 420px));
      }
    }
    /* 手机：1 列铺满 */
    @media (max-width: 620px) {
      #reader-services .rs-grid {
        grid-template-columns: minmax(0, 480px);
        gap: 16px;
      }
      #reader-services .rs-title-main { letter-spacing: 0.12em; }
      #reader-services .rs-sample-hint { font-size: 0.7rem; padding: 4px 9px; }

      .rs-modal.is-open { padding: 0; }
      .rs-modal-box {
        width: 100%; height: 100%;
        border-radius: 0;
        border: 0;
      }
      .rs-modal-head { padding: 10px 12px; }
      .rs-modal-title { font-size: 0.85rem; }
      .rs-modal-link { font-size: 0.72rem; }
    }
  </style>

  <!-- 顶部 -->
  <div class="rs-head">
    <div class="rs-seal">数<br>学</div>
    <h2 class="rs-title-main">数学笔记 · 读者服务</h2>
    <div class="rs-ornament">精选讲义 · 匠心整理</div>
    <p class="rs-sub">下方仅展示部分样张，点击样张可预览。<br>确认合适后，可下单购买。</p>
  </div>

  <div class="rs-wechat-tip" id="rs-wechat-tip">
    📌 你正在微信内浏览。购买笔记时如提示无法打开，请点击右上角 <strong>“···”</strong>，选择<strong>“在浏览器中打开”</strong>，即可正常跳转闲鱼。
  </div>

  <!-- 卡片由 JavaScript 生成 -->
  <div class="rs-grid" id="rs-grid"></div>

  <!-- PDF 预览模态框（JS 会自动移到 body 下） -->
  <div class="rs-modal" id="rs-modal" aria-hidden="true">
    <div class="rs-modal-mask" data-rs-close></div>
    <div class="rs-modal-box" role="dialog" aria-modal="true" aria-labelledby="rs-modal-title">
      <div class="rs-modal-head">
        <span class="rs-modal-title" id="rs-modal-title">样章预览</span>
        <div class="rs-modal-actions">
          <a class="rs-modal-link" id="rs-modal-link" href="#" target="_blank" rel="noopener noreferrer">新窗口打开 ↗</a>
          <button class="rs-modal-close" id="rs-modal-close" type="button" aria-label="关闭预览">✕</button>
        </div>
      </div>
      <div class="rs-modal-body">
        <iframe id="rs-modal-frame" class="rs-modal-frame" title="笔记样章 PDF 预览" src="about:blank" hidden></iframe>
        <div class="rs-modal-tip" id="rs-modal-tip" hidden>
          <p class="rs-modal-tip-title">微信内暂不支持预览 PDF</p>
          <p>请点击右上角 <strong>“···”</strong>，选择<strong>“在浏览器中打开”</strong>后，再点击笔记样张即可正常预览。</p>
          <p class="rs-modal-tip-alt">或长按下方链接复制，粘贴到浏览器中访问：</p>
          <a class="rs-modal-tip-link" id="rs-modal-tip-link" href="#" target="_blank" rel="noopener noreferrer">样章 PDF 链接</a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  // ============================================================
  // 【需要你修改的地方】笔记产品数据
  //   cover   : 样张缩略图路径（建议 4:3，1200×900）
  //   pdf     : 样章 PDF 路径（放在仓库 pdf/ 目录）
  //   xianyu  : 闲鱼商品分享链接
  //   数量不限，复制 { ... } 块继续添加即可
  // ============================================================
  var products = [
    {
      id: 'note-01',
      title: '高中 · 高考数学解题方法与技巧',
      desc: '没有技巧的数学不叫数学，30个专题讲座（40多个小时的视频）揭示了高中数学几乎所有的主流解题技巧和解题方法，手把手教会你如何解题，让你的解题能力得到质的提升',
      price: '798',
      cover: 'photo/1.jpg',
      pdf: 'prob-1.pdf',
      xianyu: 'https://m.tb.cn/h.j9lCqsf?tk=NjlT6dWCzIr HU006'
    },
    {
      id: 'note-02',
      title: '高中数学 · 自学教程',
      desc: '好的教材才是你真正的良师益友，它甚至可以让你不求别人便能光芒万丈。一线名师苦心制作的66个讲座注定不平凡，知识点丰富、讲解深入浅出且幽默感十足，让你在愉快中获得知识和提升解题能力。',
      price: '798',
      cover: 'photo/2.jpg',
      pdf: 'prob-2.pdf',
      xianyu: 'https://m.tb.cn/h.REPLACE02?tk=xxxx'
    },
    {
      id: 'note-03',
      title: '高中数学 · 竞赛图书推荐',
      desc: '精选的48册全英文优秀高中数学竞赛图书，为你铺就起一条从初中入门，走向IMO金牌的不平凡之路，道路虽然艰辛，但沿途全是收获，成就感拉满，教程、习题、真题等应有尽有，值得拥有。',
      price: '120',
      cover: 'photo/3.jpg',
      pdf: 'prob-3.pdf',
      xianyu: 'https://m.tb.cn/h.REPLACE02?tk=xxxx'
    },
    {
      id: 'note-04',
      title: '大学数学 · 竞赛图书推荐',
      desc: '精选21册优秀的大学数学专业和非数学专业竞赛图书，包括教程、习题、解题方法和策略等。',
      price: '50',
      cover: 'photo/4.jpg',
      pdf: 'prob-4.pdf',
      xianyu: 'https://m.tb.cn/h.REPLACE03?tk=xxxx'
    },

    {
      id: 'note-05',
      title: '大学数学 · 优秀图书推荐',
      desc: '为你精选115本全英文大学数学专业优秀图书，代数、分析、几何、方程等一应俱全，从本科到研究生的教材都在这里，。',
      price: '120',
      cover: 'photo/5.jpg',
      pdf: 'prob-5.pdf',
      xianyu: 'https://m.tb.cn/h.REPLACE03?tk=xxxx'
    },

    {
      id: 'note-06',
      title: '日本数理化 · 优秀图书推荐',
      desc: '为你精选87本日本初高中数理化优秀图书，教材、教材习题精选、高考和数学竞赛资料应有尽有，',
      price: '120',
      cover: 'photo/6.jpg',
      pdf: 'prob-6.pdf',
      xianyu: 'https://m.tb.cn/h.REPLACE03?tk=xxxx'
    }
    // 继续添加……
  ];

  var section = document.getElementById('reader-services');
  if (!section) return;

  var grid       = section.querySelector('#rs-grid');
  var modal      = section.querySelector('#rs-modal');
  var modalTitle = section.querySelector('#rs-modal-title');
  var modalLink  = section.querySelector('#rs-modal-link');
  var modalClose = section.querySelector('#rs-modal-close');
  var modalFrame = section.querySelector('#rs-modal-frame');
  var modalTip   = section.querySelector('#rs-modal-tip');
  var tipLink    = section.querySelector('#rs-modal-tip-link');
  var wechatTip  = section.querySelector('#rs-wechat-tip');

  // 把模态框挂到 body 下，避免被父容器 transform/overflow 影响
  if (modal && modal.parentNode !== document.body) {
    document.body.appendChild(modal);
  }

  var UA = navigator.userAgent || '';
  var isWeChat = /MicroMessenger/i.test(UA);
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(UA);

  if (isWeChat && wechatTip) wechatTip.classList.add('is-visible');

  // ---------- 工具 ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---------- 渲染卡片 ----------
  products.forEach(function (p) {
    var card = document.createElement('article');
    card.className = 'rs-card';

    var media = p.cover
      ? '<img src="' + esc(p.cover) + '" alt="' + esc(p.title) + ' 样张" loading="lazy">'
      : '<span class="rs-sample-empty">笔 记 样 张</span>';

    card.innerHTML =
      '<button class="rs-sample" type="button" ' +
        'data-pdf="' + esc(p.pdf) + '" ' +
        'data-title="' + esc(p.title) + '" ' +
        'aria-label="预览 ' + esc(p.title) + ' 样章">' +
        media +
        '<span class="rs-sample-hint">点击查看样章 ▸</span>' +
      '</button>' +
      '<div class="rs-body">' +
        '<h3 class="rs-card-title">' + esc(p.title) + '</h3>' +
        '<p class="rs-card-desc">' + esc(p.desc) + '</p>' +
        '<div class="rs-foot">' +
          '<span class="rs-price"><i>¥</i>' + esc(p.price) + '</span>' +
          '<a class="rs-buy" href="' + esc(p.xianyu) + '" target="_blank" rel="noopener noreferrer">暂不支持闲鱼购买</a>' +
        '</div>' +
      '</div>';

    grid.appendChild(card);
  });

  // ---------- 模态框控制 ----------
  function showModal() {
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function hideModal() {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    modalFrame.src = 'about:blank';
    modalFrame.hidden = true;
    modalTip.hidden = true;
  }

  function openPreview(pdf, title) {
    if (!pdf) return;

    // 微信内：显示引导面板（微信基本打不开 PDF）
    if (isWeChat) {
      modalTitle.textContent = title;
      modalLink.href = pdf;
      tipLink.href = pdf;
      tipLink.textContent = pdf;
      modalFrame.hidden = true;
      modalFrame.src = 'about:blank';
      modalTip.hidden = false;
      showModal();
      return;
    }

    // 手机端：直接新窗口打开，调用系统 PDF 阅读器（iOS iframe 只显示首页）
    if (isMobile) {
      window.open(pdf, '_blank', 'noopener');
      return;
    }

    // 电脑端：页面内 iframe 预览
    modalTitle.textContent = title + ' · 样章预览';
    modalLink.href = pdf;
    modalTip.hidden = true;
    modalFrame.hidden = false;
    modalFrame.src = pdf + '#view=FitH';
    showModal();
  }

  // ---------- 事件绑定 ----------
  grid.addEventListener('click', function (e) {
    var sample = e.target.closest('.rs-sample');
    if (sample) {
      openPreview(sample.dataset.pdf, sample.dataset.title);
      return;
    }
    var buy = e.target.closest('.rs-buy');
    if (buy && isWeChat && wechatTip) {
      setTimeout(function () { wechatTip.classList.add('is-visible'); }, 300);
    }
  });

  modalClose.addEventListener('click', hideModal);
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-rs-close')) hideModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) hideModal();
  });
})();
</script>
